schema: spec-driven

# Read by the harness (/sdd-apply, /sdd-verify); ignored by plain OpenSpec.
strict_tdd: true

context: |
  Product: Specialist Appointment Scheduling & Waitlist. Current feature: contact preference, the telephone path and slot rules (PS-001 v2.4, prototype V3), built on the archived waitlist-visibility-notification change. Patients join a single specialist's waitlist and see a status (Joined, Waiting, Notified, Booked), not a queue position. Each patient has a read-only contact preference (in_app, telephone, or not recorded, which is treated as telephone). Staff release an open slot to the patient who is next in line. An in-app patient gets a banner and accepts (after a confirm step) or declines; a telephone or not-recorded patient is reached by a staff call and staff record their accept or decline. Staff can pass an unanswered offer on.
  Sources: docs/PS-001-Specialist-Waitlist-v2.4.md (stories US-001..US-011, rules BR-001..BR-013), docs/PRD-specialist-appointment-waitlist.md, docs/prototype-walkthroughV3.md. Earlier versions in docs/ are superseded.
  UI visual reference: docs/waitlist-prototypeV3.html. Where the prototype and the PS differ the PS wins: closed (booked) entries are not shown in the staff table, a patient who joins an empty waitlist is not notified immediately, and the prototype's "Reset demo", fixed slot time and "(you)" label are not built.
  Hidden, not removed: patient-facing position, patient leaving and staff removal have no screens in this iteration (the product spec defers them) but their API endpoints, services and tests stay.
  Tech stack: TypeScript (strict), Node 24, monorepo apps/api + apps/web + packages/shared (response types shared by both sides). API: Express, Zod, SQLite via Knex and better-sqlite3 behind a repository layer, JWT auth with roles patient|staff. Web: React, Vite, React Query. Tests: Vitest, Supertest, Testing Library.
  Scope: one specialist in one clinic. Out of scope: automatic timer or cascade, self-service slot browsing, staff-confirmed booking, email/SMS or any out-of-app channel, automating the phone call, a notification centre, real calendar write-back, capturing or editing the contact preference, handling of cancellations, multi-specialist support.
  Decisions taken by assumption, pending Product Owner confirmation: not recorded is treated as telephone; each patient has exactly one response channel (an in-app answer from a telephone or not-recorded patient is refused, and staff cannot record for an in-app patient); a passed-over patient is not offered the same slot again; staff recording is one click with no confirmation; staff enter the slot date and time when they release a new slot, and a returned slot stays open and is reused with the same date and time; if nobody is eligible no release action is offered; the pilot specialty (Cardiology in the demo) and the compliance framework are still open.
  Sign-in is a demo stand-in (passwordless, only when DEMO_LOGIN=true) for a real identity provider; never enable it anywhere real.
  Conventions: entry status is waiting|notified|booked|removed; position is computed on read, never stored; at most one outstanding offer (unique index); every state change runs in one transaction with its audit record; a staff-recorded response is audited as offer_accepted_by_staff or offer_declined_by_staff; "not recorded means telephone" is decided in one place (responseChannelOf); a slot is identified by its canonical date and time; no PII (names, patient identifiers) in logs or error messages; code, comments and UI copy in English; conventional commits.

rules:
  proposal:
    - Reference user stories (US-xxx) and business rules (BR-xxx) by ID
    - List decisions taken by assumption and anything the product spec defers
  specs:
    - Use Given/When/Then style scenarios (WHEN/THEN) and RFC 2119 keywords (SHALL, MUST, SHOULD, MAY)
    - Name the user story or business rule each requirement traces to
    - Do not specify behaviour the product spec defers (an automatic timer or cascade, staff-confirmed booking, email/SMS, or a notification centre)
  design:
    - Document decisions with rationale and the alternative rejected
    - State which prototype screens and states each UI decision is based on, and what the prototype does not cover
    - Use Mermaid for any diagram, never ASCII art
  tasks:
    - Group by numbered phase; each task is completable in one session
    - Every task ends with a concrete verification (the test or check that proves it)
    - Tag tasks with the spec requirement or scenario they satisfy

operations:
  apply:
    guidance:
      - Work one numbered task group at a time and stop after each group for review
      - Write the test first where a test runner exists; run the task's verification before ticking its checkbox
      - Reuse existing helpers and shared types before adding new ones
      - Do not build what the product spec defers (an automatic timer or cascade to the next patient, staff-confirmed booking, email/SMS, or a notification centre)
      - Keep PII out of logs and error messages
      - Stop and ask if a task needs behaviour the specs or design do not describe
      - Before calling a task group done, run npm run build, npm run lint and npm test and report any failure
  archive:
    guidance:
      - Summarize which specs were merged into openspec/specs and any assumptions still awaiting Product Owner confirmation
