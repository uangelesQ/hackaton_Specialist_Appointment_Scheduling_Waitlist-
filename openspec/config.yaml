schema: spec-driven

# Read by the harness (/sdd-apply, /sdd-verify); ignored by plain OpenSpec.
strict_tdd: true

context: |
  Product: Specialist Appointment Scheduling & Waitlist. Current feature: Waitlist Visibility & Slot Offers (PS-001 v0.4, MVP). Patients join a single specialist's waitlist and see their place as "#N" (never a total). Staff release an open slot; the first eligible patient is notified with an in-app banner and can accept (after a confirm step) or decline. Staff manage the list, release slots and pass unanswered offers on.
  Sources: docs/PS-001-Waitlist-Visibility-NotificationV3.md (stories US-001..US-010, rules BR-001..BR-009), docs/PRD-specialist-appointment-waitlist.md, docs/prototype-walkthrough_V2.md.
  UI visual reference: docs/waitlist-prototype_V2.html (layout, colours, type). It has no leave/add/remove controls or login; those are built in the same style. Where the prototype and the PS differ the PS wins: declining does not cascade to the next patient, closed (booked/removed) entries are not shown in the staff table, and the prototype's "Reset demo" and fixed slot time are not built.
  Tech stack: TypeScript (strict), Node 24, monorepo apps/api + apps/web + packages/shared (response types shared by both sides). API: Express, Zod, SQLite via Knex and better-sqlite3 behind a repository layer, JWT auth with roles patient|staff. Web: React, Vite, React Query. Tests: Vitest, Supertest, Testing Library.
  Scope: one specialist in one clinic. Out of scope: automatic timer or cascade, self-service slot browsing, staff-confirmed booking, email/SMS or any out-of-app channel, a notification centre, handling of cancellations, multi-specialist support.
  Decisions taken by assumption, pending Product Owner confirmation: staff enter the slot date and time when they release a new slot; a returned slot (declined, passed on with nobody behind, or holder removed) stays open and is reused with the same date and time; if every waiting patient declined it no release action is offered; after a pass-on the next patient is the next waiting patient behind the holder who has not declined that slot; compliance framework still open.
  Sign-in is a demo stand-in (passwordless, only when DEMO_LOGIN=true) for a real identity provider; never enable it anywhere real.
  Conventions: entry status is waiting|notified|booked|removed; position is computed on read, never stored; at most one outstanding offer (unique index); every state change runs in one transaction with its audit record; no PII (names, patient identifiers) in logs or error messages; code, comments and UI copy in English; conventional commits.

rules:
  proposal:
    - Reference user stories (US-xxx) and business rules (BR-xxx) by ID
    - List decisions taken by assumption and anything the product spec defers
  specs:
    - Use Given/When/Then style scenarios (WHEN/THEN) and RFC 2119 keywords (SHALL, MUST, SHOULD, MAY)
    - Name the user story or business rule each requirement traces to
    - Do not specify behaviour the product spec defers (an automatic timer or cascade, staff-confirmed booking, email/SMS, or a notification centre)
  design:
    - Document decisions with rationale and the alternative rejected
    - State which prototype screens and states each UI decision is based on, and what the prototype does not cover
    - Use Mermaid for any diagram, never ASCII art
  tasks:
    - Group by numbered phase; each task is completable in one session
    - Every task ends with a concrete verification (the test or check that proves it)
    - Tag tasks with the spec requirement or scenario they satisfy

operations:
  apply:
    guidance:
      - Work one numbered task group at a time and stop after each group for review
      - Write the test first where a test runner exists; run the task's verification before ticking its checkbox
      - Reuse existing helpers and shared types before adding new ones
      - Do not build what the product spec defers (an automatic timer or cascade to the next patient, staff-confirmed booking, email/SMS, or a notification centre)
      - Keep PII out of logs and error messages
      - Stop and ask if a task needs behaviour the specs or design do not describe
      - Before calling a task group done, run npm run build, npm run lint and npm test and report any failure
  archive:
    guidance:
      - Summarize which specs were merged into openspec/specs and any assumptions still awaiting Product Owner confirmation
